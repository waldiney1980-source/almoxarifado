name: Publicar no GitHub Pages

# Publica o site a cada push na main. O repositório é estático (HTML puro),
# então o "build" é só empacotar a raiz e enviar para o Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:   # permite publicar manualmente pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já está no ar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
