<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Almoxarifado NorteShopping</title>
<style>
:root{
  /* Identidade ALLOS: petróleo #00616F/#00464B, laranja #FAA634, verde #008E82, neutro quente #CCC5BC */
  --accent:#00616F; --accent-strong:#00464B; --accent-soft:#e2eeef;
  --page:#f5f4f1; --surface:#ffffff; --surface-2:#f8f7f4;
  --ink:#15211f; --ink-2:#4c5a57; --ink-3:#8b948f;
  --line:#e3e1da; --line-soft:#eeece5;
  --good:#0ca30c; --good-bg:#e8f6e8; --good-ink:#0a6e0a;
  --warn:#c98500; --warn-bg:#fdf3dd; --warn-ink:#8a5c00;
  --crit:#d03b3b; --crit-bg:#fbe9e9; --crit-ink:#a52727;
  --laranja:#FAA634; --laranja-ink:#00332f;
  --sidebar-bg:#00464B; --sidebar-ink:#bfd8d6; --sidebar-active:#FAA634; --sidebar-active-ink:#00332f;
  --grid:#e1e0d9; --shadow:0 1px 3px rgba(21,33,31,.07),0 1px 2px rgba(21,33,31,.05);
  --chart-bar:#00616F; --chart-bar-2:#8fc1c4;
}
@media (prefers-color-scheme: dark){
  :root{
    --page:#0e1716; --surface:#152220; --surface-2:#1b2a28;
    --ink:#ecf2f0; --ink-2:#b7c4c0; --ink-3:#7e8b87;
    --line:#283835; --line-soft:#22302e;
    --accent:#3fa9b5; --accent-strong:#2c8c97; --accent-soft:#123b40;
    --good:#2fbb2f; --good-bg:#123a12; --good-ink:#7fdc7f;
    --warn:#fab219; --warn-bg:#3d2f0a; --warn-ink:#f7cd6b;
    --crit:#e66767; --crit-bg:#421919; --crit-ink:#f1a0a0;
    --laranja:#FAA634; --laranja-ink:#00332f;
    --sidebar-bg:#062e31; --sidebar-ink:#9fc0be; --sidebar-active:#FAA634; --sidebar-active-ink:#00332f;
    --grid:#2c2c2a; --shadow:0 1px 3px rgba(0,0,0,.4);
    --chart-bar:#3fa9b5; --chart-bar-2:#1f5f66;
  }
}
:root[data-theme="dark"]{
  --page:#0e1716; --surface:#152220; --surface-2:#1b2a28;
  --ink:#ecf2f0; --ink-2:#b7c4c0; --ink-3:#7e8b87;
  --line:#283835; --line-soft:#22302e;
  --accent:#3fa9b5; --accent-strong:#2c8c97; --accent-soft:#123b40;
  --good:#2fbb2f; --good-bg:#123a12; --good-ink:#7fdc7f;
  --warn:#fab219; --warn-bg:#3d2f0a; --warn-ink:#f7cd6b;
  --crit:#e66767; --crit-bg:#421919; --crit-ink:#f1a0a0;
  --laranja:#FAA634; --laranja-ink:#00332f;
  --sidebar-bg:#062e31; --sidebar-ink:#9fc0be; --sidebar-active:#FAA634; --sidebar-active-ink:#00332f;
  --grid:#2c2c2a; --shadow:0 1px 3px rgba(0,0,0,.4);
  --chart-bar:#3fa9b5; --chart-bar-2:#1f5f66;
}
:root[data-theme="light"]{
  --page:#f5f4f1; --surface:#ffffff; --surface-2:#f8f7f4;
  --ink:#15211f; --ink-2:#4c5a57; --ink-3:#8b948f;
  --line:#e3e1da; --line-soft:#eeece5;
  --accent:#00616F; --accent-strong:#00464B; --accent-soft:#e2eeef;
  --good:#0ca30c; --good-bg:#e8f6e8; --good-ink:#0a6e0a;
  --warn:#c98500; --warn-bg:#fdf3dd; --warn-ink:#8a5c00;
  --crit:#d03b3b; --crit-bg:#fbe9e9; --crit-ink:#a52727;
  --laranja:#FAA634; --laranja-ink:#00332f;
  --sidebar-bg:#00464B; --sidebar-ink:#bfd8d6; --sidebar-active:#FAA634; --sidebar-active-ink:#00332f;
  --grid:#e1e0d9; --shadow:0 1px 3px rgba(21,33,31,.07),0 1px 2px rgba(21,33,31,.05);
  --chart-bar:#00616F; --chart-bar-2:#8fc1c4;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Gantari,Montserrat,"Segoe UI",system-ui,-apple-system,sans-serif;
  background:var(--page); color:var(--ink); font-size:14px; line-height:1.45;
}
#app{display:flex; min-height:100vh}

/* ============ SIDEBAR ============ */
.sidebar{
  width:222px; flex:0 0 222px; background:var(--sidebar-bg); color:var(--sidebar-ink);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.sidebar .logo{
  padding:18px 16px 14px; border-bottom:1px solid rgba(255,255,255,.12);
  display:flex; align-items:center; gap:11px;
}
.sidebar .logo svg{width:27px; height:30px; flex:0 0 27px}
.sidebar .logo .t1{font-weight:700; font-size:15px; color:#fff; letter-spacing:.2px}
.sidebar .logo .t2{font-size:10.5px; text-transform:uppercase; letter-spacing:.8px; margin-top:2px; opacity:.85}
.nav{padding:10px 8px; display:flex; flex-direction:column; gap:2px}
.nav button{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:none; border:0; color:var(--sidebar-ink); font:inherit; font-size:13.5px;
  padding:9px 12px; border-radius:6px; cursor:pointer;
}
.nav button:hover{background:rgba(255,255,255,.08); color:#fff}
.nav button.active{background:var(--sidebar-active); color:var(--sidebar-active-ink); font-weight:600}
.nav button:focus-visible{outline:2px solid #fff; outline-offset:-2px}
.nav .badge{margin-left:auto; background:#d03b3b; color:#fff; font-size:11px; font-weight:700;
  border-radius:9px; padding:1px 7px; min-width:18px; text-align:center}
.nav svg{width:16px; height:16px; flex:0 0 16px}
.sidebar .foot{margin-top:auto; padding:12px 16px; font-size:11px; opacity:.6}

/* ============ MAIN ============ */
.main{flex:1; min-width:0; display:flex; flex-direction:column}
.topbar{
  display:flex; align-items:center; gap:14px; padding:12px 22px;
  background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;
}
.topbar h1{font-size:16px; font-weight:600; margin:0; white-space:nowrap}
.searchwrap{margin-left:auto; position:relative; width:min(340px,40%)}
.searchwrap input{
  width:100%; padding:8px 12px 8px 34px; border:1px solid var(--line); border-radius:7px;
  background:var(--surface-2); color:var(--ink); font:inherit;
}
.searchwrap svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--ink-3)}
.userchip{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-2); white-space:nowrap}
.userchip .avatar{width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px}
.content{padding:20px 22px 40px; display:flex; flex-direction:column; gap:18px}

/* ============ COMPONENTS ============ */
.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px}
.card{background:var(--surface); border:1px solid var(--line-soft); border-radius:10px; padding:16px 18px; box-shadow:var(--shadow)}
.kpi .lbl{font-size:11px; text-transform:uppercase; letter-spacing:.7px; color:var(--ink-3); font-weight:600}
.kpi .val{font-size:30px; font-weight:700; margin-top:4px; line-height:1.1}
.kpi .sub{font-size:12px; color:var(--ink-2); margin-top:4px}
.kpi.alerta .val{color:var(--crit)}
.kpi.ok .val{color:var(--good-ink)}
.panelgrid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media(max-width:980px){.panelgrid{grid-template-columns:1fr}}
.panel{background:var(--surface); border:1px solid var(--line-soft); border-radius:10px; box-shadow:var(--shadow); overflow:hidden}
.panel .phead{display:flex; align-items:center; gap:10px; padding:13px 18px; border-bottom:1px solid var(--line-soft)}
.panel .phead h3{margin:0; font-size:13.5px; font-weight:600}
.panel .phead .hint{font-size:11.5px; color:var(--ink-3); margin-left:auto}
.panel .pbody{padding:14px 18px}
.panel .pbody.flush{padding:0}

.tablewrap{overflow:auto; max-height:65vh; overscroll-behavior:contain}
table.data{width:100%; border-collapse:collapse; font-size:13px}
table.data th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-3);
  font-weight:600; padding:9px 14px; border-bottom:0; box-shadow:inset 0 -1px 0 var(--line); white-space:nowrap;
  background:var(--surface-2);
  position:sticky; top:0; z-index:2;
}
table.data td{padding:9px 14px; border-bottom:1px solid var(--line-soft); vertical-align:middle}
table.data tr:last-child td{border-bottom:0}
table.data tbody tr:hover{background:var(--surface-2)}
table.data td.num, table.data th.num{text-align:right; font-variant-numeric:tabular-nums}
.empty{padding:34px 20px; text-align:center; color:var(--ink-3); font-size:13px}

.pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600;
  border-radius:20px; padding:3px 10px; white-space:nowrap}
.pill::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor}
.pill.verde{background:var(--good-bg); color:var(--good-ink)}
.pill.amarelo{background:var(--warn-bg); color:var(--warn-ink)}
.pill.vermelho{background:var(--crit-bg); color:var(--crit-ink)}
.pill.azul{background:var(--accent-soft); color:var(--accent)}
.pill.cinza{background:var(--line-soft); color:var(--ink-2)}
.tag-hoje{display:inline-flex; align-items:center; gap:5px; background:var(--crit); color:#fff;
  font-size:11px; font-weight:700; border-radius:5px; padding:3px 8px; text-transform:uppercase; letter-spacing:.4px}

.btn{
  display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink); font:inherit; font-size:13px; font-weight:600; padding:8px 14px; border-radius:7px; cursor:pointer;
}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{background:var(--accent-strong); border-color:var(--accent-strong)}
.btn.danger{color:var(--crit); border-color:var(--crit)}
.btn.danger:hover{background:var(--crit-bg)}
.btn.sm{padding:5px 10px; font-size:12px}
.btn svg{width:14px; height:14px}
.btnrow{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.iconbtn{background:none; border:0; cursor:pointer; padding:5px; border-radius:5px; color:var(--ink-2); display:inline-flex}
.iconbtn:hover{background:var(--line-soft); color:var(--ink)}
.iconbtn.del:hover{background:var(--crit-bg); color:var(--crit)}
.iconbtn svg{width:15px; height:15px}

.formgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px}
.span2{grid-column:span 2}
@media(max-width:600px){.span2{grid-column:auto}}
.field{display:flex; flex-direction:column; gap:4px}
.field label{font-size:11.5px; font-weight:600; color:var(--ink-2); text-transform:uppercase; letter-spacing:.4px}
.field input,.field select,.field textarea{
  padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--surface);
  color:var(--ink); font:inherit; width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent)}
.field .req{color:var(--crit)}
.filterbar{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; padding:13px 18px; border-bottom:1px solid var(--line-soft); background:var(--surface)}
.filterbar .field{min-width:140px; flex:0 1 auto}

/* charts */
.chart svg{display:block; width:100%; height:auto}
.chart .bar{fill:var(--chart-bar)}
.chart .bar:hover{fill:var(--accent-strong)}
.chart .gridline{stroke:var(--grid); stroke-width:1}
.chart .axis{fill:var(--ink-3); font-size:11px}
.chart .vlabel{fill:var(--ink-2); font-size:11px; font-weight:600}
.chart .baseline{stroke:var(--line); stroke-width:1}

/* modal */
.modal-overlay{position:fixed; inset:0; background:rgba(10,16,28,.55); z-index:100;
  display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px 16px; overflow-y:auto}
.modal{background:var(--surface); border-radius:12px; box-shadow:0 20px 50px rgba(0,0,0,.3);
  width:100%; max-width:680px; overflow:hidden}
.modal.sm{max-width:440px}
.modal .mhead{display:flex; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line-soft)}
.modal .mhead h3{margin:0; font-size:15px; font-weight:600}
.modal .mhead .iconbtn{margin-left:auto}
.modal .mbody{padding:18px 20px}
.modal .mfoot{display:flex; justify-content:flex-end; gap:8px; padding:14px 20px; border-top:1px solid var(--line-soft); background:var(--surface-2)}

/* toast */
#toasts{position:fixed; bottom:18px; right:18px; z-index:200; display:flex; flex-direction:column; gap:8px}
.toast{background:var(--ink); color:var(--page); padding:10px 16px; border-radius:8px; font-size:13px;
  box-shadow:0 4px 14px rgba(0,0,0,.25); max-width:340px; animation:tin .2s ease}
.toast.err{background:var(--crit); color:#fff}
@keyframes tin{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
@media(prefers-reduced-motion:reduce){.toast{animation:none}}

.viewhead{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.viewhead h2{margin:0; font-size:18px; font-weight:700}
.viewhead .desc{color:var(--ink-2); font-size:13px}
.viewhead .btnrow{margin-left:auto}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.loclabel{font-size:12px; color:var(--ink-2); white-space:nowrap}

/* responsive */
@media(max-width:840px){
  #app{flex-direction:column}
  .sidebar{width:100%; flex:none; height:auto; position:static}
  .nav{flex-direction:row; flex-wrap:wrap}
  .nav button{width:auto}
  .sidebar .foot{display:none}
  .topbar{flex-wrap:wrap}
  .searchwrap{width:100%; order:3; margin-left:0}
}
input[type=file]{display:none}
a{color:var(--accent)}

/* login */
.auth-wrap{position:fixed; inset:0; z-index:300; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(900px 500px at 80% -10%, rgba(0,97,111,.55), transparent 60%), linear-gradient(160deg,#00464B,#003237); padding:20px}
.auth-card{background:var(--surface); color:var(--ink); border-radius:14px; box-shadow:0 20px 50px rgba(0,0,0,.35);
  width:100%; max-width:390px; padding:28px 26px}
.auth-card .alogo{display:flex; align-items:center; gap:12px; margin-bottom:18px}
.auth-card .alogo svg{width:30px; height:33px}
.auth-card h2{margin:0 0 4px; font-size:18px}
.auth-card .sub{font-size:13px; color:var(--ink-2); margin-bottom:16px}
.auth-card .field{margin-bottom:12px}
.auth-msg{font-size:13px; margin:10px 0 0; min-height:18px}
.auth-msg.err{color:var(--crit)}
.auth-msg.ok{color:var(--good-ink)}
.auth-loading{position:fixed; inset:0; z-index:290; display:flex; align-items:center; justify-content:center;
  background:var(--page); color:var(--ink-2); font-size:14px; flex-direction:column; gap:12px}
</style>

<div id="app">
  <aside class="sidebar">
    <div class="logo">
      <svg viewBox="0 0 94.75 105.24" xmlns="http://www.w3.org/2000/svg" aria-label="ALLOS" role="img">

</div>

<script>
"use strict";
/* ================= NUVEM (Supabase) ================= */
const SUPA_URL = "https://mhqhbnfbfrfsckhcvzis.supabase.co";
const SUPA_KEY = "sb_publishable_cz6stQiD91vUY50hapD3Qw_Non3Y2ea";
const SESS_KEY = "alx_sessao_v1";
const OPER_KEY = "alx_operador_v1";
const DB_KEY_ANTIGO = "alx_norteshopping_v1"; // base LocalStorage da versão anterior

const uid = () => (crypto.randomUUID ? crypto.randomUUID() :
  "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random()*16|0; return (c==="x" ? r : (r&3|8)).toString(16);
  }));

let db = { items:[], movs:[], compras:[], user: localStorage.getItem(OPER_KEY) || "Almoxarife" };

/* ---- sessão ---- */
let sess = null;
try{ sess = JSON.parse(localStorage.getItem(SESS_KEY) || "null"); }catch(e){}
function setSess(s){
  sess = s;
  if(s) localStorage.setItem(SESS_KEY, JSON.stringify(s));
  else localStorage.removeItem(SESS_KEY);
}
async function authReq(path, body){
  const r = await fetch(`${SUPA_URL}/auth/v1/${path}`, {
    method:"POST", headers:{ "Content-Type":"application/json", apikey:SUPA_KEY },
    body: JSON.stringify(body)
  });
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(traduzAuth(d.error_description || d.msg || d.message || ("falha de autenticação ("+r.status+")")));
  return d;
}
function traduzAuth(m){
  const t = {
    "Invalid login credentials":"E-mail ou senha incorretos.",
    "Email not confirmed":"E-mail ainda não confirmado. Verifique sua caixa de entrada.",
    "User already registered":"Este e-mail já tem conta. Use “Entrar”.",
    "Password should be at least 6 characters":"A senha precisa ter pelo menos 6 caracteres."
  };
  return t[m] || m;
}
function saveTokens(d){
  setSess({
    access_token: d.access_token, refresh_token: d.refresh_token,
    expires_at: Math.floor(Date.now()/1000) + (d.expires_in||3600) - 60,
    email: (d.user && d.user.email) || (sess && sess.email) || ""
  });
}
let refreshEmCurso = null;
async function ensureToken(){
  if(!sess) throw new Error("Sessão expirada. Entre novamente.");
  if(sess.expires_at > Math.floor(Date.now()/1000)) return sess.access_token;
  if(!refreshEmCurso){
    refreshEmCurso = authReq("token?grant_type=refresh_token", { refresh_token: sess.refresh_token })
      .then(d => { saveTokens(d); })
      .finally(() => { refreshEmCurso = null; });
  }
  await refreshEmCurso;
  return sess.access_token;
}
async function api(pathQuery, opts){
  opts = opts || {};
  for(let tent=0; tent<2; tent++){
    const token = await ensureToken();
    const r = await fetch(`${SUPA_URL}/rest/v1/${pathQuery}`, {
      method: opts.method || "GET",
      headers: Object.assign({ apikey:SUPA_KEY, Authorization:"Bearer "+token, "Content-Type":"application/json" }, opts.headers||{}),
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    if(r.status===401 && tent===0){ if(sess) sess.expires_at = 0; continue; }
    if(!r.ok){
      const d = await r.json().catch(()=>({}));
      throw new Error(d.message || d.hint || d.details || ("erro "+r.status+" no servidor"));
    }
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  }
}

/* ---- mapeamento app ⇄ tabelas ---- */
const itemToRow = i => ({ id:i.id, codigo:i.codigo||"", descricao:i.descricao||"", categoria:i.categoria||"",
  unidade:i.unidade||"UN", atual:i.atual||0, min:i.min||0, max:i.max||0, valor_unit:i.valorUnit||0,
  prateleira:i.prateleira||"", coluna:i.coluna||"", gaveta:i.gaveta||"", fornecedor:i.fornecedor||"",
  lead_time:i.leadTime||0, ultima_compra:i.ultimaCompra||"" });
const rowToItem = r => ({ id:r.id, codigo:r.codigo, descricao:r.descricao, categoria:r.categoria,
  unidade:r.unidade, atual:r.atual, min:r.min, max:r.max, valorUnit:r.valor_unit,

/* ---- sincronização: snapshot + gravação por diferença ---- */
let snap = { alx_itens:{}, alx_movs:{}, alx_compras:{} }; // id -> {json, updated_at}
let saving = false, savePendente = false, syncErro = false;

async function fetchAll(table){
  const out = [];
  for(let from=0;;from+=1000){
    const page = await api(`${table}?select=*&order=id.asc`, { headers:{ Range: from+"-"+(from+999) } });
    out.push(...(page||[]));
    if(!page || page.length<1000) break;
  }
  return out;
}
async function loadCloud(){
  const novo = {};
  const novoSnap = { alx_itens:{}, alx_movs:{}, alx_compras:{} };
  for(const t of TABS){
    const rows = await fetchAll(t.table);
    novo[t.key] = rows.map(t.fromRow);
    for(let i=0;i<rows.length;i++){
      novoSnap[t.table][rows[i].id] = {
        json: JSON.stringify(t.toRow(novo[t.key][i])),
        updated_at: Number(rows[i].updated_at)||0
      };
    }
  }
  db.items = novo.items; db.movs = novo.movs; db.compras = novo.compras;
  snap = novoSnap;
}
function save(){ queueSave(); }
function queueSave(){
  if(saving){ savePendente = true; return; }
  doSave();
}
async function doSave(){
  saving = true; savePendente = false; syncUI("saving");
  try{
    const agora = Date.now();
    const dels = [], ups = [], novoSnap = [];
    for(const t of TABS){
      const vivos = new Set();
      const upRows = [];
      for(const obj of db[t.key]){
        vivos.add(obj.id);
        const row = t.toRow(obj);
        const j = JSON.stringify(row);
        const s = snap[t.table][obj.id];
        if(!s || s.json !== j){
          const ua = Math.max(agora, s ? s.updated_at+1 : 0);
          upRows.push(Object.assign({ updated_at: ua }, row));
          novoSnap.push([t.table, obj.id, j, ua]);
        }
      }
      const delIds = Object.keys(snap[t.table]).filter(id => !vivos.has(id));
      if(delIds.length) dels.push([t.table, delIds]);
      if(upRows.length) ups.push([t.table, upRows]);
    }
    // exclusões primeiro: ao substituir a lista inteira, os códigos antigos saem
    // antes de os novos entrarem (o código do item é único no banco)
    for(const [table, ids] of dels){
      for(let i=0;i<ids.length;i+=80)
        await api(`${table}?id=in.(${ids.slice(i,i+80).join(",")})`, { method:"DELETE", headers:{ Prefer:"return=minimal" } });
      for(const id of ids) delete snap[table][id];
    }
    for(const [table, rows] of ups){
      for(let i=0;i<rows.length;i+=500)
        await api(table, { method:"POST", body:rows.slice(i,i+500),
          headers:{ Prefer:"resolution=merge-duplicates,return=minimal" } });
    }
    for(const [table,id,j,ua] of novoSnap) snap[table][id] = { json:j, updated_at:ua };
    syncErro = false; syncUI("ok");
  }catch(e){
    syncErro = true; syncUI("erro");
    toast("Falha ao salvar na nuvem: " + e.message + ". Vou tentar de novo em instantes.", true);
    setTimeout(queueSave, 15000);
  }finally{
    saving = false;
    if(savePendente) queueSave();
  }
}
function syncUI(state){
  const el = document.getElementById("syncstate");
  if(!el) return;
  if(state==="saving") el.textContent = "Salvando na nuvem…";
  else if(state==="erro") el.innerHTML = '<span style="color:#ffb3a8">Sem conexão — alterações pendentes</span>';
  else el.textContent = "Nuvem sincronizada às " + new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
}
/* ids do formato antigo (não-uuid) viram uuid, preservando as referências */
function normalizeIds(d){
  const isU = s => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(s||""));
  const map = {};
  const fix = id => { if(isU(id)) return String(id).toLowerCase(); if(!map[id]) map[id] = uid(); return map[id]; };
  (d.items||[]).forEach(i => i.id = fix(i.id));
  (d.movs||[]).forEach(m => { m.id = fix(m.id); m.itemId = fix(m.itemId); });
  (d.compras||[]).forEach(c => { c.id = fix(c.id); c.itemId = fix(c.itemId); });
}

const todayISO = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const parseISO = s => { const [y,m,d]=String(s||"").split("-").map(Number); return new Date(y||1970,(m||1)-1,d||1); };
const dISO = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

function statusItem(it){
  if(it.atual <= it.min) return "vermelho";
  if(it.atual <= it.min * 1.1) return "amarelo";
  return "verde";
}
const statusLabel = { verde:"Normal", amarelo:"Atenção", vermelho:"Crítico" };

function consumoPeriodo(itemId, dias){
  const lim = new Date(); lim.setDate(lim.getDate() - dias);
  return db.movs.filter(m => m.type==="saida" && m.itemId===itemId && parseISO(m.date) >= lim)
                .reduce((s,m) => s + m.qty, 0);
}
function mediaDiaria(itemId){ return consumoPeriodo(itemId, 90) / 90; }
function diasAteRuptura(it){
  const md = mediaDiaria(it.id);
  if(md <= 0) return Infinity;
  return it.atual / md;
}
function comprarHoje(it){
  const md = mediaDiaria(it.id);
  const lt = it.leadTime || 0;
  return md > 0 && lt > 0 && it.atual < md * lt;
}

/* auto purchase requests */
function syncCompras(){
  for(const it of db.items){
    const aberta = db.compras.find(c => c.itemId===it.id && (c.status==="Pendente" || c.status==="Comprado"));
    if(it.atual <= it.min){
      if(!aberta){
        db.compras.push({ id:uid(), itemId:it.id, qtd:Math.max(1,(it.max||0)-it.atual), status:"Pendente", criadaEm:todayISO() });
      } else if(aberta.status==="Pendente"){
        aberta.qtd = Math.max(1,(it.max||0)-it.atual);
      }
    } else {
      // stock recovered: drop stale pending auto-requests
      db.compras = db.compras.filter(c => !(c.itemId===it.id && c.status==="Pendente"));
    }
  }
  db.compras = db.compras.filter(c => itemById(c.itemId));
}
function comprasAbertas(){ return db.compras.filter(c => c.status==="Pendente" || c.status==="Comprado"); }

function commit(){ syncCompras(); save(); render(); }

/* ================= CHARTS (SVG) ================= */
function barChartV(data, {h=210, fmt=fmtN.format.bind(fmtN)}={}){
  if(!data.length || data.every(d=>!d.value)) return '<div class="empty">Sem dados no período. Registre saídas para alimentar o gráfico.</div>';
  const w = 560, padL = 40, padR = 8, padT = 18, padB = 26;
  const iw = w - padL - padR, ih = h - padT - padB;
  const max = Math.max(...data.map(d=>d.value), 1);
  const step = iw / data.length;
  const bw = Math.min(44, step * 0.55);
  const ticks = 4;
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Gráfico de barras">`;
  for(let t=0;t<=ticks;t++){
    const v = max*t/ticks, y = padT + ih - ih*t/ticks;
    s += `<line class="gridline" x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}"/>`;
    s += `<text class="axis" x="${padL-6}" y="${y+4}" text-anchor="end">${fmt(Math.round(v))}</text>`;
  }
  data.forEach((d,i)=>{
    const bh = Math.max(d.value>0?2:0, ih * d.value/max);
    const x = padL + step*i + (step-bw)/2, y = padT + ih - bh;
    s += `<g><rect class="bar" x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3"><title>${esc(d.label)}: ${fmt(d.value)}</title></rect>`;
    if(d.value>0) s += `<text class="vlabel" x="${x+bw/2}" y="${y-5}" text-anchor="middle">${fmt(d.value)}</text>`;
    s += `<text class="axis" x="${padL + step*i + step/2}" y="${h-8}" text-anchor="middle">${esc(d.label)}</text></g>`;
  });
  s += `<line class="baseline" x1="${padL}" y1="${padT+ih}" x2="${w-padR}" y2="${padT+ih}"/></svg>`;
  return `<div class="chart">${s}</div>`;
}
function barChartH(data, {fmt=fmtN.format.bind(fmtN)}={}){
  if(!data.length) return '<div class="empty">Sem consumo registrado nos últimos 90 dias.</div>';
  const w = 560, rowH = 34, padT = 6, padB = 6, labelW = 170;
  const h = padT + padB + rowH*data.length;
  const iw = w - labelW - 60;
  const max = Math.max(...data.map(d=>d.value),1);
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Itens mais consumidos">`;
  data.forEach((d,i)=>{
    const y = padT + rowH*i, bw = Math.max(2, iw*d.value/max);
    const lbl = d.label.length>26 ? d.label.slice(0,25)+"…" : d.label;
    s += `<g><text class="axis" x="${labelW-8}" y="${y+rowH/2+4}" text-anchor="end">${esc(lbl)}<title>${esc(d.label)}</title></text>`;
    s += `<rect class="bar" x="${labelW}" y="${y+rowH/2-8}" width="${bw}" height="16" rx="3"><title>${esc(d.label)}: ${fmt(d.value)}</title></rect>`;
    s += `<text class="vlabel" x="${labelW+bw+8}" y="${y+rowH/2+4}">${fmt(d.value)}</text></g>`;
  });
  s += `</svg>`;
  return `<div class="chart">${s}</div>`;
}

function openItemModal(id){
  const it = id ? itemById(id) : null;
  openModal(`
    <div class="mhead"><h3>${it?"Editar item":"Novo item"}</h3><button class="iconbtn" data-close>${I.x}</button></div>
    <div class="mbody">${itemForm(it)}</div>
    <div class="mfoot"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="save-item">${it?"Salvar alterações":"Cadastrar"}</button></div>`);
  document.getElementById("save-item").onclick = () => {
    const g = i => document.getElementById(i).value.trim();
    const codigo = g("f-codigo"), descricao = g("f-descricao");
    if(!codigo || !descricao){ toast("Código e descrição são obrigatórios.", true); return; }
    const dupe = db.items.find(x => x.codigo.toLowerCase()===codigo.toLowerCase() && x.id!==(it&&it.id));
    if(dupe){ toast("Já existe um item com o código "+codigo+".", true); return; }
    const data = {
      codigo, descricao, categoria:g("f-categoria"), unidade:g("f-unidade")||"UN",
      atual:num(g("f-atual")), min:num(g("f-min")), max:num(g("f-max")),
      prateleira:g("f-prateleira"), coluna:g("f-coluna"), gaveta:g("f-gaveta"),
      fornecedor:g("f-fornecedor"), leadTime:Math.round(num(g("f-leadtime"))), ultimaCompra:g("f-ultima"),
      valorUnit:num(g("f-valor"))
    };
    if(it) Object.assign(it, data);
    else db.items.push(Object.assign({id:uid()}, data));
    closeModal(); toast(it?"Item atualizado.":"Item cadastrado."); commit();
  };
}

function wireMovForm(tipo){
  const btn = document.getElementById("m-save");
  if(!btn) return;
  const sel = document.getElementById("m-item");
  sel.addEventListener("change", ()=>{
    const it = itemById(sel.value);
    document.getElementById("m-hint").textContent = it ? `Estoque atual: ${fmtN.format(it.atual)} ${it.unidade||"UN"} · mínimo ${fmtN.format(it.min)}` : "";
  });
  btn.onclick = () => {
    const it = itemById(sel.value);
    const qtd = num(document.getElementById("m-qtd").value);
    const date = document.getElementById("m-data").value || todayISO();
    const obs = document.getElementById("m-obs").value.trim();
    const equip = tipo==="saida" ? document.getElementById("m-equip").value.trim() : "";
    const req = tipo==="saida" ? document.getElementById("m-req").value.trim() : "";
    if(!it){ toast("Selecione um item.", true); return; }
    if(qtd<=0){ toast("Informe uma quantidade maior que zero.", true); return; }
    if(tipo==="saida" && !req){ toast("Informe o requisitante (quem pediu o material).", true); return; }
    const registrar = () => {
      it.atual = tipo==="saida" ? it.atual - qtd : it.atual + qtd;
      db.movs.push({ id:uid(), type:tipo, itemId:it.id, qty:qtd, date, obs, equip, req, user:db.user, ts:Date.now() });
      if(tipo==="entrada") it.ultimaCompra = it.ultimaCompra && it.ultimaCompra>date ? it.ultimaCompra : date;
      toast((tipo==="saida"?"Saída":"Entrada")+` registrada: ${fmtN.format(qtd)} × ${it.descricao}. Novo saldo: ${fmtN.format(it.atual)}.`);
      commit();
    };
    if(tipo==="saida" && qtd>it.atual){
      confirmDlg(`A saída (${fmtN.format(qtd)}) é maior que o estoque atual (${fmtN.format(it.atual)}). O saldo ficará negativo. Continuar?`, registrar, "Registrar mesmo assim");
      return;
    }
    registrar();
  };
}

/* ---------- Minimal XLSX writer (stored ZIP) ---------- */
const CRC_TABLE = (()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n]=c; } return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = CRC_TABLE[(c^u8[i])&0xFF] ^ (c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipStore(files){ // files: [{name, text}]
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  for(const f of files){
    const nameB = enc.encode(f.name), data = enc.encode(f.text);
    const crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true);
    lh.setUint16(8,0,true); lh.setUint16(10,0,true); lh.setUint16(12,0,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true);
    lh.setUint16(26,nameB.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer), nameB, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true);
    ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true);
    ch.setUint16(28,nameB.length,true);
    ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer), nameB);
    offset += 30 + nameB.length + data.length;
  }
  const cdSize = central.reduce((s,p)=>s+p.length,0);
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0,0x06054b50,true);
  eocd.setUint16(8,files.length,true); eocd.setUint16(10,files.length,true);
  eocd.setUint32(12,cdSize,true); eocd.setUint32(16,offset,true);
  return new Blob([...parts, ...central, new Uint8Array(eocd.buffer)], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function colName(n){ let s=""; n++; while(n>0){ const r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26); } return s; }
function sheetXML(rows){
  const xr = rows.map((row,ri)=>"<row r=\""+(ri+1)+"\">"+row.map((v,ci)=>{
    const ref = colName(ci)+(ri+1);
    if(typeof v==="number" && isFinite(v)) return `<c r="${ref}"><v>${v}</v></c>`;
    const t = esc(String(v==null?"":v));
    return t===""?"":`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${t}</t></is></c>`;
  }).join("")+"</row>").join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${xr}</sheetData></worksheet>`;
}
function makeXLSX(rows, sheetName){
  return zipStore([
    { name:"[Content_Types].xml", text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>` },
    { name:"_rels/.rels", text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name:"xl/workbook.xml", text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${esc(sheetName||"Dados")}" sheetId="1" r:id="rId1"/></sheets></workbook>` },

<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>` },

/* ---------- Minimal XLSX reader ---------- */
async function unzip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let e = -1;
  for(let i=buf.byteLength-22; i>=0; i--){ if(dv.getUint32(i,true)===0x06054b50){ e=i; break; } }
  if(e<0) throw new Error("Arquivo ZIP/XLSX inválido");
  const count = dv.getUint16(e+10,true);
  let off = dv.getUint32(e+16,true);
  const entries = {};
  for(let i=0;i<count;i++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    const method = dv.getUint16(off+10,true);
    const csize = dv.getUint32(off+20,true);
    const nlen = dv.getUint16(off+28,true), elen = dv.getUint16(off+30,true), clen = dv.getUint16(off+32,true);
    const lho = dv.getUint32(off+42,true);
    const name = new TextDecoder().decode(u8.subarray(off+46, off+46+nlen));
    entries[name] = { method, csize, lho };
    off += 46 + nlen + elen + clen;
  }
  return {
    names: Object.keys(entries),
    async text(name){
      const en = entries[name]; if(!en) return null;
      const nlen = dv.getUint16(en.lho+26,true), elen = dv.getUint16(en.lho+28,true);
      const start = en.lho + 30 + nlen + elen;
      const data = u8.slice(start, start+en.csize);
      if(en.method===0) return new TextDecoder().decode(data);
      if(en.method!==8) throw new Error("Compressão não suportada");
      const out = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
      return new TextDecoder().decode(out);
    }
  };
}
function cellCol(ref){ let c=0; for(const ch of ref){ if(ch>="A"&&ch<="Z") c=c*26+(ch.charCodeAt(0)-64); else break; } return c-1; }
async function parseXLSX(buf){
  const z = await unzip(buf);
  let shared = [];
  const ssx = await z.text("xl/sharedStrings.xml");
  if(ssx){
    const doc = new DOMParser().parseFromString(ssx, "application/xml");
    shared = [...doc.getElementsByTagName("si")].map(si => [...si.getElementsByTagName("t")].map(t=>t.textContent).join(""));
  }
  let sheetName = "xl/worksheets/sheet1.xml";
  if(!z.names.includes(sheetName)) sheetName = z.names.find(n => /^xl\/worksheets\/.*\.xml$/.test(n));
  if(!sheetName) throw new Error("Nenhuma planilha encontrada no arquivo");
  const sx = await z.text(sheetName);
  const doc = new DOMParser().parseFromString(sx, "application/xml");
  const rows = [];
  for(const rowEl of doc.getElementsByTagName("row")){
    const row = [];
    for(const c of rowEl.getElementsByTagName("c")){
      const ref = c.getAttribute("r") || "";
      const col = ref ? cellCol(ref) : row.length;
      const t = c.getAttribute("t");
      let val = "";
      if(t==="inlineStr"){ val = [...c.getElementsByTagName("t")].map(x=>x.textContent).join(""); }
      else {
        const v = c.getElementsByTagName("v")[0];
        val = v ? v.textContent : "";
        if(t==="s") val = shared[Number(val)] ?? "";
      }
      row[col] = val;
    }
    rows.push(row);
  }
  return rows;
}
function parseCSVText(text){
  text = text.replace(/^﻿/,"");
  const firstLine = text.split(/\r?\n/,1)[0] || "";
  const sep = (firstLine.match(/;/g)||[]).length >= (firstLine.match(/,/g)||[]).length ? ";" : ",";
  const rows = [];
  let row = [], cur = "", inQ = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else inQ=false; } else cur+=ch; }
    else if(ch==='"') inQ = true;
    else if(ch===sep){ row.push(cur); cur=""; }
    else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n") i++; row.push(cur); cur=""; if(row.some(v=>v!=="")) rows.push(row); row=[]; }
    else cur+=ch;
  }
  row.push(cur); if(row.some(v=>v!=="")) rows.push(row);
  return rows;

const normHdr = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");
const HDR_MAP = {
  codigo:"codigo", cod:"codigo", sku:"codigo",
  descricao:"descricao", descricao_do_item:"descricao", item:"descricao", nome:"descricao",
  categoria:"categoria", grupo:"categoria", familia:"categoria",
  unidade:"unidade", un:"unidade", und:"unidade",
  estoque_minimo:"min", estoque_minimo_aceitavel:"min", minimo:"min", min:"min", estoque_min:"min",
  estoque_maximo:"max", maximo:"max", max:"max", estoque_max:"max",
  estoque_atual:"atual", quantidade_em_estoque:"atual", atual:"atual", saldo:"atual", quantidade:"atual", qtd:"atual",
  valor_unitario:"valorUnit", valor_unitario_r:"valorUnit", valor:"valorUnit", preco:"valorUnit", preco_unitario:"valorUnit", custo_unitario:"valorUnit",
  localizacao:"localizacao", local:"localizacao", endereco:"localizacao",
  prateleira:"prateleira", coluna:"coluna", gaveta:"gaveta",
  fornecedor:"fornecedor", fornecedor_principal:"fornecedor",
  lead_time:"leadTime", leadtime:"leadTime", lead_time_dias:"leadTime", prazo:"leadTime",
  ultima_compra:"ultimaCompra", ult_compra:"ultimaCompra"
};
function excelDateToISO(v){
  const n = Number(v);
  if(isFinite(n) && n>20000 && n<80000){ const d = new Date(Date.UTC(1899,11,30) + n*86400000); return dISO(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())); }
  const s = String(v).trim();
  const br = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(br){ let y=Number(br[3]); if(y<100) y+=2000; return y+"-"+br[2].padStart(2,"0")+"-"+br[1].padStart(2,"0"); }

function importRows(rows){
  if(!rows.length) return { add:0, upd:0, skip:0 };
  // localiza a linha de cabeçalho (pode não ser a primeira — ex.: planilhas com título ALLOS)
  let hi = -1, hdr = null;
  for(let i=0; i<Math.min(rows.length,15); i++){
    const h = (rows[i]||[]).map(x => HDR_MAP[normHdr(x)] || null);
    if(h.includes("codigo") && h.includes("descricao")){ hi = i; hdr = h; break; }
  }
  if(hi < 0)
    throw new Error("Cabeçalho não reconhecido. São necessárias ao menos as colunas “codigo” e “descricao” (em qualquer uma das 15 primeiras linhas).");
  let add=0, upd=0, skip=0;
  for(let r=hi+1;r<rows.length;r++){
    const o = {};
    (rows[r]||[]).forEach((v,c)=>{ if(hdr[c]) o[hdr[c]] = v; });
    const codigo = String(o.codigo||"").trim(), descricao = String(o.descricao||"").trim();
    if(!codigo || !descricao || normHdr(codigo)==="codigo"){ skip++; continue; }
    const data = {
      codigo, descricao,
      categoria:String(o.categoria||"").trim(), unidade:String(o.unidade||"UN").trim()||"UN",
      atual:num(o.atual), min:num(o.min), max:num(o.max),
      valorUnit:num(o.valorUnit),
      prateleira:String(o.prateleira||"").trim(), coluna:String(o.coluna||"").trim(), gaveta:String(o.gaveta||"").trim(),
      fornecedor:String(o.fornecedor||"").trim(), leadTime:Math.round(num(o.leadTime)),
      ultimaCompra:o.ultimaCompra ? excelDateToISO(o.ultimaCompra) : ""
    };
    if(!data.prateleira && o.localizacao) data.prateleira = String(o.localizacao).trim();
    // sem estoque máximo na planilha: assume 2× o mínimo (editável depois)
    if(!data.max && data.min) data.max = data.min * 2;
    const ex = db.items.find(i=>i.codigo.toLowerCase()===codigo.toLowerCase());
    if(ex){
      // atualiza os essenciais; campos opcionais só sobrescrevem se vierem preenchidos
      ex.descricao = data.descricao; ex.atual = data.atual; ex.min = data.min;
      if(data.categoria) ex.categoria = data.categoria;
      if(data.unidade && data.unidade!=="UN") ex.unidade = data.unidade; else ex.unidade = ex.unidade || data.unidade;
      if(num(o.max)) ex.max = num(o.max); else if(!ex.max && data.max) ex.max = data.max;
      if(data.valorUnit) ex.valorUnit = data.valorUnit;
      if(data.prateleira) ex.prateleira = data.prateleira;
      if(data.coluna) ex.coluna = data.coluna;
      if(data.gaveta) ex.gaveta = data.gaveta;
      if(data.fornecedor) ex.fornecedor = data.fornecedor;
      if(data.leadTime) ex.leadTime = data.leadTime;
      if(data.ultimaCompra) ex.ultimaCompra = data.ultimaCompra;
      upd++;
    }
    else { db.items.push(Object.assign({id:uid()}, data)); add++; }
  }
  return { add, upd, skip };
}

    "Hidráulica":[["HD-001","Reparo válvula descarga","UN",5,6,18,"HidroPeças",8],["HD-002","Tubo PVC 50mm (barra 6m)","BR",12,6,20,"HidroPeças",6],["HD-003","Bomba submersível 1CV","UN",1,2,4,"BombasRio",20],["HD-004","Anel de vedação 50mm","UN",25,15,60,"HidroPeças",5]],
    "HVAC":[["AC-001","Filtro de ar G4 610x610","UN",14,12,48,"ClimaFiltros",10],["AC-002","Correia A-42","UN",9,6,24,"RolaTec",7],["AC-003","Gás refrigerante R-410A (kg)","KG",18,10,40,"FrioGás",12],["AC-004","Rolamento 6205 ZZ","UN",4,6,20,"RolaTec",9]],
    "Civil":[["CV-001","Cimento CP-II 50kg","SC",10,8,30,"ConstruNorte",4],["CV-002","Rejunte cinza 1kg","UN",22,10,40,"ConstruNorte",4],["CV-003","Fita antiderrapante (rolo)","RL",7,4,16,"SegurPiso",8]],
    "Segurança":[["SG-001","Luva nitrílica (par)","PR",35,25,100,"EPI Center",6],["SG-002","Capacete com jugular","UN",11,8,25,"EPI Center",6],["SG-003","Sinalizador de piso molhado","UN",6,4,12,"SegurPiso",8]]
  };
  db.items = [];
  const locs = ["A","B","C","D"];
  let li = 0;
  for(const [cat, items] of Object.entries(cats)){
    for(const [codigo, descricao, unidade, atual, min, max, fornecedor, leadTime] of items){
      db.items.push({ id:uid(), codigo, descricao, categoria:cat, unidade, atual, min, max,
        prateleira:locs[li%4], coluna:String(1+(li%5)), gaveta:String(1+(li%3)),
        fornecedor, leadTime, ultimaCompra:"", valorUnit:Math.round((12+(li*37)%420)*100)/100 });
      li++;
    }
  }
  const equips = ["Chiller 01","Chiller 02","Escada rolante L2","Escada rolante L3","Elevador social 04","Praça de alimentação","Subestação","Banheiros L1","Fachada","Docas"];
  db.movs = [];
  let seed = 42;
  const rnd = () => { seed = (seed*1103515245+12345) & 0x7fffffff; return seed/0x7fffffff; };
  const today = new Date();
  for(const it of db.items){
    const freq = 2 + Math.floor(rnd()*5);
    for(let m=0;m<6;m++){
      const n = Math.max(0, Math.round(freq * (0.6+rnd()*0.9)));
      for(let k=0;k<n;k++){
        const d = new Date(today.getFullYear(), today.getMonth()-m, 1+Math.floor(rnd()*27));
        if(d>today) continue;
        const qty = Math.max(1, Math.round((it.max/12) * (0.4+rnd()*1.2)));
        db.movs.push({ id:uid(), type:"saida", itemId:it.id, qty, date:dISO(d),
          equip:equips[Math.floor(rnd()*equips.length)], user:"Almoxarife",
          obs:"OS "+(4000+Math.floor(rnd()*900)), ts:d.getTime() });
      }
      if(rnd()>0.5){
        const d = new Date(today.getFullYear(), today.getMonth()-m, 3+Math.floor(rnd()*24));
        if(d<=today){
          const qty = Math.max(2, Math.round(it.max*0.4*(0.5+rnd())));
          db.movs.push({ id:uid(), type:"entrada", itemId:it.id, qty, date:dISO(d),
            equip:"", user:"Almoxarife", obs:"NF "+(1000+Math.floor(rnd()*8000)), ts:d.getTime() });
          if(!it.ultimaCompra || it.ultimaCompra<dISO(d)) it.ultimaCompra = dISO(d);
        }
      }
    }
  }
  db.compras = [];
  toast("Dados de exemplo carregados: "+db.items.length+" itens e "+db.movs.length+" movimentações.");
  commit();
}

/* ================= AUDITORIA ================= */
let auditRows = null, auditCarregando = false, auditFiltros = { de:"", ate:"", email:"", tabela:"" };
const auditEmails = new Set();
const AUD_TABELA = { alx_itens:"Item", alx_movs:"Movimentação", alx_compras:"Compra" };
const AUD_ACAO = { criou:["Criou","verde"], alterou:["Alterou","amarelo"], excluiu:["Excluiu","vermelho"] };
const AUD_CAMPO = { codigo:"código", descricao:"descrição", categoria:"categoria", unidade:"unidade",
  atual:"estoque atual", min:"mínimo", max:"máximo", valor_unit:"valor unitário", prateleira:"prateleira",
  coluna:"coluna", gaveta:"gaveta", fornecedor:"fornecedor", lead_time:"lead time", ultima_compra:"última compra",
  qty:"quantidade", date:"data", obs:"observação", equip:"equipamento", requisitante:"requisitante", usuario:"operador", type:"tipo",
  qtd:"quantidade", status:"status", criada_em:"criada em", recebida_em:"recebida em", item_id:"item" };
const audVal = v => v===null||v===undefined||v===""?"—":(typeof v==="number"?fmtN.format(v):String(v));
const audProximoDia = s => { const d = parseISO(s); d.setDate(d.getDate()+1); return dISO(d); };

function audDescreve(r){
  const d = r.dados || {};
  if(r.tabela==="alx_itens") return `${esc(d.descricao||"")} <span class="muted small mono">${esc(d.codigo||"")}</span>`;
  const it = itemById(d.item_id);
  const nome = it ? it.descricao : "(item excluído)";
  if(r.tabela==="alx_movs") return `${d.type==="saida"?"Saída":"Entrada"} de ${fmtN.format(d.qty||0)} × ${esc(nome)}${d.date?` em ${fdate(d.date)}`:""}`;
  return `Solicitação de compra — ${esc(nome)}${d.status?` (${esc(d.status)})`:""}`;
}
function audMudancas(r){
  if(r.acao!=="alterou" || !r.antes) return "";
  const mud = [];
  for(const k of Object.keys(r.dados||{})){
    if(k==="id"||k==="updated_at"||k==="ts") continue;
    if(JSON.stringify(r.antes[k])!==JSON.stringify(r.dados[k]))
      mud.push(`<strong>${esc(AUD_CAMPO[k]||k)}</strong>: ${esc(audVal(r.antes[k]))} → ${esc(audVal(r.dados[k]))}`);
  }
  return mud.join(" · ");
}
async function carregarAuditoria(){
  if(auditCarregando) return;
  auditCarregando = true;
  try{
    let q = "alx_audit?select=*&order=id.desc";
    const f = auditFiltros;
    if(f.de) q += "&criado_em=gte." + f.de;
    if(f.ate) q += "&criado_em=lt." + audProximoDia(f.ate);
    if(f.email) q += "&email=eq." + encodeURIComponent(f.email);
    if(f.tabela) q += "&tabela=eq." + f.tabela;
    auditRows = await api(q, { headers:{ Range:"0-499" } }) || [];
    auditRows.forEach(r => { if(r.email) auditEmails.add(r.email); });
  }catch(e){
    auditRows = [];
    toast("Falha ao carregar a auditoria: " + e.message, true);
  }
  auditCarregando = false;
  if(current==="auditoria") render(true);
}
function vAuditoria(){
  const f = auditFiltros;
  const emails = [...auditEmails].sort();
  const rows = auditRows;
  return `
  <div class="viewhead"><h2>Auditoria</h2>
    <span class="desc">Quem criou, alterou ou excluiu cada registro — preenchida automaticamente pelo banco, não pode ser editada pelo app</span></div>
  <div class="panel">
    <div class="filterbar">
      <div class="field"><label>De</label><input type="date" id="au-de" value="${esc(f.de)}"></div>
      <div class="field"><label>Até</label><input type="date" id="au-ate" value="${esc(f.ate)}"></div>
      <div class="field" style="min-width:210px"><label>Usuário</label><select id="au-email">
        <option value="">Todos</option>
        ${emails.map(e=>`<option value="${esc(e)}" ${f.email===e?"selected":""}>${esc(e)}</option>`).join("")}</select></div>
      <div class="field"><label>Registro</label><select id="au-tabela">
        <option value="">Todos</option>
        <option value="alx_itens" ${f.tabela==="alx_itens"?"selected":""}>Itens</option>
        <option value="alx_movs" ${f.tabela==="alx_movs"?"selected":""}>Movimentações</option>
        <option value="alx_compras" ${f.tabela==="alx_compras"?"selected":""}>Compras</option></select></div>
      <button class="btn sm" id="au-clear">Limpar filtros</button>
      <button class="btn sm" id="au-reload">${I.hist} Atualizar</button>
    </div>
    <div class="pbody flush">
    ${rows===null ? '<div class="empty">Carregando auditoria…</div>' :
      rows.length ? `<div class="tablewrap"><table class="data"><thead><tr>
        <th>Quando</th><th>Usuário</th><th>Ação</th><th>Registro</th><th>O quê</th><th>Mudanças</th></tr></thead><tbody>
      ${rows.map(r=>{ const ac = AUD_ACAO[r.acao]||[r.acao,"cinza"]; return `<tr>
        <td style="white-space:nowrap">${fmtDT.format(new Date(r.criado_em))}</td>
        <td>${esc(r.email||"—")}</td>
        <td><span class="pill ${ac[1]}">${ac[0]}</span></td>
        <td>${AUD_TABELA[r.tabela]||esc(r.tabela)}</td>
        <td>${audDescreve(r)}</td>
        <td class="small">${audMudancas(r)||'<span class="muted">—</span>'}</td></tr>`}).join("")}
      </tbody></table>${rows.length>=500?'<div class="empty">Exibindo os 500 registros mais recentes. Use os filtros para refinar.</div>':""}</div>`
      : '<div class="empty">Nenhum registro de auditoria com estes filtros.</div>'}
  </div></div>`;
}
function wireAuditoria(){
  if(auditRows===null && !auditCarregando) carregarAuditoria();
  const g = id => document.getElementById(id);
  const upd = () => {
    auditFiltros = { de:g("au-de").value, ate:g("au-ate").value, email:g("au-email").value, tabela:g("au-tabela").value };
    carregarAuditoria();
  };
  ["au-de","au-ate","au-email","au-tabela"].forEach(id => { const el=g(id); if(el) el.addEventListener("change",upd); });
  if(g("au-clear")) g("au-clear").onclick = () => { auditFiltros={de:"",ate:"",email:"",tabela:""}; carregarAuditoria(); render(true); };
  if(g("au-reload")) g("au-reload").onclick = () => carregarAuditoria();
}

/* ================= MODAL ================= */
function openModal(html, size){
  const root = document.getElementById("modal-root");
  root.innerHTML = `<div class="modal-overlay"><div class="modal ${size||""}" role="dialog" aria-modal="true">${html}</div></div>`;
  root.querySelector(".modal-overlay").addEventListener("mousedown", e => { if(e.target===e.currentTarget) closeModal(); });
  root.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
  const first = root.querySelector("input,select,button.primary");
  if(first) first.focus();
}
function closeModal(){ document.getElementById("modal-root").innerHTML = ""; }
document.addEventListener("keydown", e => { if(e.key==="Escape") closeModal(); });
function confirmDlg(msg, onOk, okLabel){
  openModal(`
    <div class="mhead"><h3>Confirmação</h3><button class="iconbtn" data-close>${I.x}</button></div>
    <div class="mbody"><p style="margin:0">${esc(msg)}</p></div>
    <div class="mfoot"><button class="btn" data-close>Cancelar</button><button class="btn danger" id="cf-ok">${esc(okLabel||"Confirmar")}</button></div>`,"sm");
  document.getElementById("cf-ok").onclick = () => { closeModal(); onOk(); };
}

function wire(){

  const seed2 = document.getElementById("seed-demo2"); if(seed2) seed2.onclick = () => {
    if(!db.items.length) seedDemo();
    else confirmDlg("Isto substituirá os dados atuais pelos dados de demonstração. Continuar?", seedDemo, "Substituir");
  };
  ["lista-ns","lista-ns2"].forEach(id => {
    const b = document.getElementById(id);
    if(b) b.onclick = () => {
      if(!db.items.length) carregarListaNS();
      else confirmDlg("Isto substituirá os dados atuais pela lista oficial NorteShopping (500 itens). As movimentações serão apagadas. Continuar?", carregarListaNS, "Carregar lista");
    };
  });

    document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => openItemModal(b.dataset.edit));

      confirmDlg(`Excluir o item “${it.descricao}” (${it.codigo})? As movimentações dele permanecerão no histórico como “(excluído)”.`, () => {
        db.items = db.items.filter(x=>x.id!==it.id);
        db.compras = db.compras.filter(c=>c.itemId!==it.id);
        toast("Item excluído."); commit();
      }, "Excluir");
    });
    bindExport("exp-itens-csv","itens.csv",()=>toCSV(itensRows()));
    bindExportX("exp-itens-xlsx","itens.xlsx",itensRows,"Itens");
  }
  if(current==="entrada") wireMovForm("entrada");
  if(current==="saida") wireMovForm("saida");
  if(current==="auditoria") wireAuditoria();
  if(current==="critico"){
    document.querySelectorAll("[data-emcompra]").forEach(ch => ch.onchange = () => {
      const c = db.compras.find(x=>x.id===ch.dataset.emcompra);
      if(!c) return;
      c.status = ch.checked ? "Comprado" : "Pendente";
      toast(ch.checked ? "Item marcado como em compra." : "Item voltou para compra pendente.");
      commit();
    });
  }
  if(current==="movs"){
    wireMovs();
    bindExport("exp-movs-csv","movimentacoes.csv",()=>toCSV(movsRows()));
    bindExportX("exp-movs-xlsx","movimentacoes.xlsx",movsRows,"Movimentações");
  }
  if(current==="compras"){
    document.querySelectorAll("[data-comprar]").forEach(b => b.onclick = () => {
      const c = db.compras.find(x=>x.id===b.dataset.comprar);
      if(c){ c.status="Comprado"; toast("Solicitação marcada como comprada."); commit(); }
    });
    document.querySelectorAll("[data-receber]").forEach(b => b.onclick = () => openReceberModal(b.dataset.receber));
    bindExport("exp-compras-csv","compras.csv",()=>toCSV(comprasRows()));
  }
  if(current==="dados"){
    bindExport("exp2-itens-csv","itens.csv",()=>toCSV(itensRows()));
    bindExportX("exp2-itens-xlsx","itens.xlsx",itensRows,"Itens");
    bindExport("exp2-movs-csv","movimentacoes.csv",()=>toCSV(movsRows()));
    bindExportX("exp2-movs-xlsx","movimentacoes.xlsx",movsRows,"Movimentações");
    const modelo = document.getElementById("dl-modelo");
    if(modelo) modelo.onclick = () => downloadBlob("modelo_itens.xlsx", makeXLSX([
      ["codigo","descricao","categoria","unidade","estoque_minimo","estoque_maximo","estoque_atual","prateleira","coluna","gaveta","fornecedor","lead_time","ultima_compra"],
      ["EL-001","Disjuntor bipolar 25A","Elétrica","UN",5,20,8,"A","1","2","Schneider BR",7,"01/06/2026"]
    ],"Modelo"));
    const fi = document.getElementById("file-import");
    if(fi) fi.addEventListener("change", async e => {
      const file = e.target.files[0]; if(!file) return;
      const out = document.getElementById("import-result");
      out.textContent = "Processando " + file.name + "…";
      try{
        let rows;
        if(/\.csv$/i.test(file.name)) rows = parseCSVText(await file.text());
        else rows = await parseXLSX(await file.arrayBuffer());
        const r = importRows(rows);
        toast(`Importação concluída: ${r.add} novos, ${r.upd} atualizados${r.skip?", "+r.skip+" ignorados":""}.`);
        commit(); go("itens");
      }catch(err){
        out.innerHTML = `<span style="color:var(--crit)">Erro: ${esc(err.message)}</span>`;
        toast("Falha na importação: " + err.message, true);
      }
      e.target.value = "";
    });
    const bke = document.getElementById("bk-export");
    if(bke) bke.onclick = () => {
      const blob = new Blob([JSON.stringify({ app:"almoxarifado-norteshopping", versao:1, geradoEm:new Date().toISOString(), ...db }, null, 2)], {type:"application/json"});
      downloadBlob("backup_almoxarifado_"+todayISO()+".json", blob);
      toast("Backup exportado.");
    };
    const bki = document.getElementById("bk-file");
    if(bki) bki.addEventListener("change", async e => {
      const file = e.target.files[0]; if(!file) return;
      try{
        const d = JSON.parse(await file.text());
        if(!Array.isArray(d.items) || !Array.isArray(d.movs)) throw new Error("Estrutura de backup não reconhecida.");
        normalizeIds(d);
        confirmDlg(`Restaurar backup com ${d.items.length} itens e ${d.movs.length} movimentações? Os dados atuais (da nuvem, para todos) serão substituídos.`, () => {
          db = { items:d.items, movs:d.movs, compras:d.compras||[], user:d.user||"Almoxarife" };
          toast("Backup restaurado."); commit();
        }, "Restaurar");
      }catch(err){ toast("Falha ao restaurar: " + err.message, true); }
      e.target.value = "";
    });
    const wipe = document.getElementById("wipe");
    if(wipe) wipe.onclick = () => {
      confirmDlg("Apagar TODOS os dados da nuvem (para todos os usuários)? Esta ação não pode ser desfeita — recomendamos exportar um backup antes.", () => {
        db = { items:[], movs:[], compras:[], user:db.user };
        toast("Base apagada."); commit();
      }, "Apagar tudo");
    };
  }
}
function bindExport(id, name, gen){
  const b = document.getElementById(id);
  if(b) b.onclick = () => { downloadBlob(name, new Blob([gen()],{type:"text/csv;charset=utf-8"})); toast(name+" exportado."); };
}
function bindExportX(id, name, rowsFn, sheet){
  const b = document.getElementById(id);
  if(b) b.onclick = () => { downloadBlob(name, makeXLSX(rowsFn(), sheet)); toast(name+" exportado."); };
}

const LOGO_ALLOS = '<svg viewBox="0 0 94.75 105.24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="#FAA634" d="M0,105.24c5.43-21.1,24.58-36.7,47.38-36.7,18.37,0,29.85,10.16,29.85,10.16,0,0-7.36-8.91-18.41-14.28l-11.33-43.43-11.1,42.35c-11.24,1.51-21,6.39-27.18,11.52L29.3,8.95c1.62-5.32,6.53-8.95,12.09-8.95h11.91c5.56,0,10.47,3.64,12.09,8.96l27.94,91.74c.54,1.48,1.02,2.99,1.42,4.54h-25.28l-.05-.2c-4.34-7.69-12.58-12.89-22.04-12.89s-17.52,5.08-21.9,12.63l-.12.46H0Z"/></svg>';
function showLogin(msg, tipo){
  document.getElementById("auth-root").innerHTML = `
  <div class="auth-wrap"><div class="auth-card">
    <div class="alogo">${LOGO_ALLOS}<div><div style="font-weight:700">NorteShopping</div><div class="small muted" style="text-transform:uppercase;letter-spacing:.8px">ALLOS · Almoxarifado</div></div></div>
    <h2>Entrar no sistema</h2>
    <p class="sub">Os dados do almoxarifado ficam na nuvem e são compartilhados pela equipe. Use o mesmo e-mail e senha do HidroLuz, se já tiver conta.</p>
    <form id="auth-form">
      <div class="field"><label>E-mail</label><input id="a-email" type="email" autocomplete="username" required></div>
      <div class="field"><label>Senha</label><input id="a-senha" type="password" autocomplete="current-password" minlength="6" required></div>
      <div class="btnrow" style="margin-top:14px">
        <button class="btn primary" type="submit" id="a-entrar" style="flex:1;justify-content:center">Entrar</button>
        <button class="btn" type="button" id="a-criar">Criar conta</button>
      </div>
    </form>
    <p class="auth-msg ${tipo||""}" id="a-msg">${esc(msg||"")}</p>
  </div></div>`;
  const m = (t, cls) => { const el = document.getElementById("a-msg"); el.textContent = t; el.className = "auth-msg "+(cls||""); };
  const entrar = async criar => {
    const email = document.getElementById("a-email").value.trim();
    const senha = document.getElementById("a-senha").value;
    if(!email || !senha){ m("Preencha e-mail e senha.", "err"); return; }
    m(criar ? "Criando conta…" : "Entrando…");
    try{
      const d = criar
        ? await authReq("signup", { email, password: senha })
        : await authReq("token?grant_type=password", { email, password: senha });
      if(!d.access_token){ m("Conta criada. Confirme o e-mail que você recebeu e depois clique em Entrar.", "ok"); return; }
      saveTokens(d);
      if(!localStorage.getItem(OPER_KEY) && sess.email){
        db.user = sess.email.split("@")[0];
        localStorage.setItem(OPER_KEY, db.user);
      }
      document.getElementById("auth-root").innerHTML = "";
      await boot();
    }catch(e){ m(e.message, "err"); }
  };
  document.getElementById("auth-form").addEventListener("submit", e => { e.preventDefault(); entrar(false); });
  document.getElementById("a-criar").onclick = () => entrar(true);
  document.getElementById("a-email").focus();
}
function showLoading(txt){
  document.getElementById("auth-root").innerHTML =
    `<div class="auth-loading"><div style="width:34px">${LOGO_ALLOS}</div><div>${esc(txt||"Carregando dados da nuvem…")}</div></div>`;
}
async function boot(){
  showLoading();
  try{
    await loadCloud();
  }catch(e){
    document.getElementById("auth-root").innerHTML = "";
    showLogin("Não consegui carregar os dados: " + e.message, "err");
    return;
  }
  document.getElementById("auth-root").innerHTML = "";
  // primeira entrada: se este navegador tem a base antiga (LocalStorage) e a nuvem está vazia, sobe tudo
  if(!db.items.length && !db.movs.length){
    try{
      const antigo = JSON.parse(localStorage.getItem(DB_KEY_ANTIGO) || "null");
      if(antigo && Array.isArray(antigo.items) && antigo.items.length){
        normalizeIds(antigo);
        db.items = antigo.items; db.movs = antigo.movs||[]; db.compras = antigo.compras||[];
        toast("Base local deste navegador enviada para a nuvem: "+db.items.length+" itens e "+db.movs.length+" movimentações.");
        commit(); syncUI("saving");
        return;
      }
    }catch(e){}
  }
  render(); syncUI("ok");
}
document.getElementById("logout").addEventListener("click", async e => {
  e.preventDefault();
  if(saving || savePendente || syncErro){ toast("Há alterações ainda não salvas na nuvem — aguarde a sincronização antes de sair.", true); return; }
  const rt = sess && sess.refresh_token;
  setSess(null);
  try{ if(rt) await fetch(`${SUPA_URL}/auth/v1/logout`, { method:"POST", headers:{ apikey:SUPA_KEY, "Content-Type":"application/json" }, body:JSON.stringify({}) }); }catch(err){}
  location.reload();
});
window.addEventListener("focus", async () => {
  if(!sess || saving || savePendente || syncErro) return;
  if(document.getElementById("modal-root").innerHTML) return; // não recarrega com um formulário aberto
  try{ await loadCloud(); render(true); syncUI("ok"); }catch(e){}
});
window.addEventListener("beforeunload", e => {
  if(saving || savePendente || syncErro){ e.preventDefault(); e.returnValue = ""; }
});
async function init(){
  if(!sess){ showLogin(); return; }
  showLoading("Verificando sessão…");
  try{ await ensureToken(); }
  catch(e){ setSess(null); showLogin("Sua sessão expirou. Entre novamente.", "err"); return; }
  await boot();
}
init();
</script>
